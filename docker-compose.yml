services:
  # The seller's wallet-headless. Used ONLY by the upto scheme to issue refund
  # transactions; the exact scheme doesn't touch it. Fund this wallet with HTR
  # before running upto demos.
  wallet-headless:
    image: hathornetwork/hathor-wallet-headless:latest
    pull_policy: always
    environment:
      HEADLESS_HTTP_BIND: "0.0.0.0"
      HEADLESS_HTTP_PORT: "8000"
      HEADLESS_NETWORK: ${HATHOR_NETWORK:-testnet}
      HEADLESS_SERVER: ${FULLNODE_URL:-https://node1.testnet.hathor.network}/v1a/
      HEADLESS_TX_MINING_URL: ${TX_MINING_URL:-https://txmining.testnet.hathor.network/}
      # wallet-headless refuses to boot without a default seed. We don't
      # actually use the "default" wallet — init-seller-wallet.sh starts the
      # "seller" wallet via POST /start with SELLER_SEED at runtime. This is
      # the classic all-"abandon" test seed (publicly known, no funds).
      HEADLESS_SEED_DEFAULT: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
    entrypoint: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/wallet/status',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The PAYER wallet-headless for the Agent Playground: holds the hUSDC
  # treasury (address 0) and one funded address per demo visitor. The dapp's
  # /api/* proxy routes are its ONLY client and auto-start the real wallet via
  # POST /start using HEADLESS_WALLET_ID + HEADLESS_SEED from the deploy env.
  # SECURITY: intentionally NO published ports — the headless has no auth, so
  # it must only be reachable on the internal compose network.
  payer-wallet-headless:
    # :master, not :latest — the /wallet/sign-message endpoint the x402 proof
    # needs is only on the headless master branch (no release ships it yet).
    # Switch back to a version tag once a release includes sign-message.
    image: hathornetwork/hathor-wallet-headless:master
    pull_policy: always
    environment:
      HEADLESS_HTTP_BIND: "0.0.0.0"
      HEADLESS_HTTP_PORT: "8000"
      HEADLESS_NETWORK: ${HATHOR_NETWORK:-testnet}
      HEADLESS_SERVER: ${FULLNODE_URL:-https://node1.testnet.hathor.network}/v1a/
      HEADLESS_TX_MINING_URL: ${TX_MINING_URL:-https://txmining.testnet.hathor.network/}
      # Boot requirement only — the real payer wallet is started at runtime by
      # the dapp via POST /start with HEADLESS_SEED. Classic all-"abandon"
      # test seed (publicly known, no funds).
      HEADLESS_SEED_DEFAULT: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
    entrypoint: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/wallet/status',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  resource-server:
    build: .
    environment:
      FULLNODE_URL: ${FULLNODE_URL:-https://node1.testnet.hathor.network}
      HATHOR_NETWORK: ${HATHOR_NETWORK:-testnet}
      RESOURCE_SERVER_PORT: "3000"
      RESOURCE_SERVER_PUBLIC_URL: ${RESOURCE_SERVER_PUBLIC_URL:-http://localhost:3000}
      SELLER_ADDRESS: ${SELLER_ADDRESS:-}
      SELLER_WALLET_URL: http://wallet-headless:8000
      SELLER_WALLET_ID: ${SELLER_WALLET_ID:-seller}
      SELLER_SEED: ${SELLER_SEED:-}
      SERVER_SECRET: ${SERVER_SECRET:-}
      REQUEST_ID_TTL_SECONDS: ${REQUEST_ID_TTL_SECONDS:-120}
      DEDUP_DB_PATH: /app/data/payments.sqlite
      ZERO_CONF_MAX_AMOUNT: ${ZERO_CONF_MAX_AMOUNT:-9007199254740991}
      HTR_PAYMENT_AMOUNT: ${HTR_PAYMENT_AMOUNT:-100}
      GENERATE_MAX_PRICE: ${GENERATE_MAX_PRICE:-500}
      PAYMENT_TOKEN_UID: ${PAYMENT_TOKEN_UID:-00}
      PAYMENT_TOKEN_SYMBOL: ${PAYMENT_TOKEN_SYMBOL:-HTR}
      LIVE_DATA_ENABLED: ${LIVE_DATA_ENABLED:-true}
      LIVE_DATA_REFRESH_MS: ${LIVE_DATA_REFRESH_MS:-60000}
      VERIFY_MODE: ${VERIFY_MODE:-self}
      FACILITATOR_URL: ${FACILITATOR_URL:-http://facilitator:8402}
    command: ["sh", "init-seller-wallet.sh", "node", "resource-server.js"]
    ports:
      - "${RESOURCE_SERVER_HOST_PORT:-3000}:3000"
    volumes:
      - x402_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wallet-headless:
        condition: service_healthy

  # Optional standalone facilitator. Off by default. Bring up with:
  #   docker compose --profile facilitator up
  # and set VERIFY_MODE=facilitator on the resource-server.
  facilitator:
    profiles: ["facilitator"]
    build: .
    environment:
      FULLNODE_URL: ${FULLNODE_URL:-https://node1.testnet.hathor.network}
      HATHOR_NETWORK: ${HATHOR_NETWORK:-testnet}
      FACILITATOR_PORT: "8402"
      SERVER_SECRET: ${SERVER_SECRET:-}
      DEDUP_DB_PATH: /app/data/payments.sqlite
      ZERO_CONF_MAX_AMOUNT: ${ZERO_CONF_MAX_AMOUNT:-9007199254740991}
    command: ["node", "facilitator.js"]
    ports:
      - "${FACILITATOR_HOST_PORT:-8402}:8402"
    volumes:
      - x402_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8402/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  dapp:
    build:
      context: ./dapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USE_MOCK_WALLET: ${NEXT_PUBLIC_USE_MOCK_WALLET:-false}
        NEXT_PUBLIC_DEFAULT_NETWORK: ${HATHOR_NETWORK:-testnet}
        NEXT_PUBLIC_RESOURCE_SERVER_URL: ${NEXT_PUBLIC_RESOURCE_SERVER_URL:-http://localhost:3000}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-8264fff563181da658ce64ee80e80458}
        NEXT_PUBLIC_HATHOR_NODE_URL_TESTNET: ${NEXT_PUBLIC_HATHOR_NODE_URL_TESTNET:-https://node1.testnet.hathor.network/v1a}
    # Runtime env for the headless-wallet proxy routes (server-side only).
    # HEADLESS_WALLET_ID, HEADLESS_SEED and TREASURY_ADDRESS come from the
    # deploy env (Dokploy) — the seed lets the dapp auto-start the wallet.
    environment:
      HEADLESS_URL: ${HEADLESS_URL:-http://payer-wallet-headless:8000}
      HEADLESS_WALLET_ID: ${HEADLESS_WALLET_ID:-default}
      HEADLESS_SEED: ${HEADLESS_SEED:-}
      HUSDC_TOKEN_UID: ${HUSDC_TOKEN_UID:-001adcc82ba9722714c849cf607d30cd3cd9c7e95b0b3cb58e1eb476fa346980}
      FUND_AMOUNT_ATOMIC: ${FUND_AMOUNT_ATOMIC:-500}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "${DAPP_HOST_PORT:-4020}:3000"
    depends_on:
      resource-server:
        condition: service_healthy
      payer-wallet-headless:
        condition: service_healthy

# Docker-managed named volume for the verifier's dedup ledger + blocklist
# (SQLite at /app/data/payments.sqlite). Both `resource-server` and the
# optional `facilitator` share it. Persists across container recreations
# and across Dokploy redeploys.
volumes:
  x402_data:
